<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrando Valores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Encontrando Valores</h1>

    <h2>Preencha os Valores ou Clique Random</h2>

    <div class="ContainerInput">
            <div class="GrupoInput">
                <p>Valor 1:</p> 
                <input type="number" name="" id="v1">
            </div>

            <div class="GrupoInput">
                <p>Valor 2:</p> 
                <input type="number" name="" id="v2">
            </div>

            <div class="GrupoInput">
                <p>Valor 3:</p> 
                <input type="number" name="" id="v3">
            </div>

            <div class="GrupoInput">
                <p>Valor 4:</p> 
                <input type="number" name="" id="v4">
            </div>

            <div class="GrupoInput">
                <p>Valor 5:</p> 
                <input type="number" name="" id="v5">
            </div>

            <div class="GrupoInput">
                <p>Valor 6:</p> 
                <input type="number" name="" id="v6">
            </div>

            <div class="GrupoInput">
                <p>Valor 7:</p> 
                <input type="number" name="" id="v7">
            </div>

            <div class="GrupoInput">
                <p>Valor 8:</p> 
                <input type="number" name="" id="v8">
            </div>

    </div>

    <div class="ContainerBotaoes">
            <div class="GrupoBotaoes">
                <input type="button" value="Verifique" id="btnVer">
            </div>

            <div class="GrupoBotaoes" id="idDivBtnRandom">
                <input type="button" value="Random" id="btnRandom">
            </div>

    </div>

    <div class="ContainerOutput">
            <div class="AllNumbers">
                <p>Os números são: <p id="p1"></p></p>
            </div>

            <div class="LessNumber">
                <p>O menor número é: <p id="p2"></p></p>
            </div>

            <div class="GreaterNumber">
                <p>O maior número é: <p id="p3"></p></p>
            </div>

            <div class="AvgNumber">
                <p>A média é: <p id="p4"></p></p>
            </div>
            
    </div>
    <script src="script.js"></script>
</body>
</html>
